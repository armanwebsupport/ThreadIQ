name: Build ThreadIQ APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - name: Copy web files to www
        run: mkdir -p www && cp -r index.html manifest.json sw.js css js assets www/
      - run: npx cap add android
      - run: npx cap sync android
      - name: Use fixed signing key (so updates install over old app)
        run: mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ThreadIQ-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
