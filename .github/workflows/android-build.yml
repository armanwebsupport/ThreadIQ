name: Build ThreadIQ APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - name: Copy web files to www
        run: mkdir -p www && cp -r index.html manifest.json sw.js css js assets www/
      - run: npx cap add android
      - run: npx cap sync android
      - name: Set app version (increases on every build so updates install)
        run: |
          sed -i -E 's/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName "[^"]*"/versionName "1.${{ github.run_number }}"/' android/app/build.gradle
          grep -nE "versionCode|versionName" android/app/build.gradle
          grep -q "versionCode ${{ github.run_number }}" android/app/build.gradle || { echo "::error::versionCode was not set"; exit 1; }
      - name: Sign with the keystore from this repo
        run: |
          test -f debug.keystore || { echo "::error::debug.keystore is missing in the repo root"; exit 1; }
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  debug {
                      storeFile file("../../debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                      storeType "pkcs12"
                  }
              }
          }
          EOF
          tail -14 android/app/build.gradle
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Verify APK is signed with the repo key
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          AS=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          $AS verify --print-certs $APK | tee cert.txt
          WANT=$(keytool -list -v -keystore debug.keystore -storepass android 2>/dev/null | grep "SHA256:" | head -1 | sed 's/.*SHA256: //' | tr -d ':' | tr 'A-F' 'a-f')
          echo "Repo keystore SHA-256: $WANT"
          grep -q "$WANT" cert.txt || { echo "::error::APK is not signed with debug.keystore - updates will NOT install"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: ThreadIQ-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
