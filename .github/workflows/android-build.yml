name: Build ThreadIQ APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - name: Copy web files to www
        run: mkdir -p www && cp -r index.html manifest.json sw.js css js assets www/
      - run: npx cap add android
      - run: npx cap sync android
      - name: Set app version (increases on every build so updates install)
        run: |
          sed -i -E 's/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName "[^"]*"/versionName "1.${{ github.run_number }}"/' android/app/build.gradle
          grep -nE "versionCode|versionName" android/app/build.gradle
          grep -q "versionCode ${{ github.run_number }}" android/app/build.gradle || { echo "::error::versionCode was not set"; exit 1; }
      - name: Use fixed signing key (so updates install over old app)
        run: mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Verify signing key
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          AS=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          $AS verify --print-certs $APK | tee cert.txt
          grep -q "63ed7f2ae4c49b6ebf811fe10d0728e89bfce659a661130b2990a86df6682075" cert.txt || { echo "::error::Signing key mismatch - this APK will NOT install over the old app"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: ThreadIQ-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
